# cargo-release configuration
# Usage: cargo release patch|minor|major

# Create a git tag for the release
tag = true
tag-message = "Release {{version}}"

# Commit message for the version bump
pre-release-commit-message = "Release v{{version}}"

# Push the commit and tag to the remote
push = true

# Don't try to publish to crates.io (we distribute via Python/maturin)
publish = false

# Run pre-release checks
verify = true

# Keep the `rev:` pins in the docs on the release being cut. `guide::tests::
# setup_pins_the_current_release` fails the build if setup.md drifts, so this is
# what stops a version bump from tripping it.
pre-release-replacements = [
  { file = "docs/src/guide/setup.md", search = "rev: v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "rev: v{{version}}" },
  { file = "docs/src/commit-hooks.md", search = "rev: v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "rev: v{{version}}" },
]
